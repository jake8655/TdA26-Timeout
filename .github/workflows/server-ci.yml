name: Backend CI

on:
  push:
    branches:
      - main
    paths:
      - "apps/server/**"
  pull_request:
    branches:
      - "*"
    paths:
      - "apps/server/**"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check build cache
        uses: actions/cache@v4
        id: cache
        with:
          path: |
            ${{ github.workspace }}/apps/server/build
          # Generate a new cache whenever Gradle configuration or source files change.
          key: ${{ runner.os }}-spring-${{ hashFiles('apps/server/**/*.gradle*', 'apps/server/gradle.properties', 'apps/server/src/**/*.java') }}
          # If source files or Gradle files changed, try to restore from a prior cache with the same prefix.
          restore-keys: |
            ${{ runner.os }}-spring-

      - name: Setup
        uses: taiki-e/install-action@just

      - name: Build
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: apps/server
        run: chmod +x ./gradlew && just build

  test:
    uses: ./.github/workflows/tests-ci.yml
    needs: build
