name: Backend CI

on:
  push:
    branches:
      - main
    paths:
      - "apps/server/**"
  pull_request:
    branches:
      - "*"
    paths:
      - "apps/server/**"

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check build cache
        uses: actions/cache@v4
        id: cache
        with:
          path: |
            ${{ github.workspace }}/apps/server/build
          key: ${{ runner.os }}-spring-${{ hashFiles('apps/server/**/*.gradle*', 'apps/server/gradle.properties', 'apps/server/src/**/*.java') }}
          restore-keys: |
            ${{ runner.os }}-spring-

      - name: Format
        if: steps.cache.outputs.cache-hit != 'true'
        uses: axel-op/googlejavaformat-action@v4
        with:
          args: "-a --set-exit-if-changed"

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check build cache
        uses: actions/cache@v4
        id: cache
        with:
          path: |
            ${{ github.workspace }}/apps/server/build
          key: ${{ runner.os }}-spring-${{ hashFiles('apps/server/**/*.gradle*', 'apps/server/gradle.properties', 'apps/server/src/**/*.java') }}
          restore-keys: |
            ${{ runner.os }}-spring-

      - name: Setup
        uses: taiki-e/install-action@just

      - name: Build
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: apps/server
        run: chmod +x ./gradlew && just build
