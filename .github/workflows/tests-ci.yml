name: Tests CI

on:
  workflow_call

env:
  DBUSERNAME: ${{ secrets.DBUSERNAME }}
  DBPASSWORD: ${{ secrets.DBPASSWORD }}
  DBURL: ${{ secrets.DBURL }}
  API_KEY: ${{ secrets.API_KEY }}
  CDN_URL: ${{ secrets.CDN_URL }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Just
        uses: taiki-e/install-action@just

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ hashFiles('**/Dockerfile', '**/compose.yaml') }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Build and start services
        run: |
          docker compose build
          docker compose up -d

      - name: Wait for services
        run: |
          echo "Waiting for backend..."
          timeout 300 bash -c 'until curl -s http://localhost:3000/ > /dev/null; do sleep 2; done'
          echo "Waiting for frontend..."
          timeout 300 bash -c 'until curl -s http://localhost:3001 > /dev/null; do sleep 2; done'

      - name: Install test dependencies
        working-directory: tests
        run: |
          bun install --frozen-lockfile
          bun run generate-types

      - name: Run tests
        working-directory: tests
        env:
          RUN_URL: http://localhost
          TEST_PHASE: 1:1
        run: bun run test:run

      - name: Cleanup
        if: always()
        run: docker compose down
