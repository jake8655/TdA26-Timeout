plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.12'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'io.ebean' version '17.2.0'
}

group = 'eu.hypnomacka.timeout'
version = '0.0.1-SNAPSHOT'
description = 'server'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

ext {
    set('springCloudVersion', "2024.0.3")
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.cloud:spring-cloud-starter'
    compileOnly 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    runtimeOnly 'com.mysql:mysql-connector-j'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    implementation 'io.github.cdimascio:dotenv-java:3.2.0'
    implementation 'de.mkammerer:argon2-jvm:2.11'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'

    // Ebean ORM
    implementation 'io.ebean:ebean:17.2.0'
    implementation 'io.ebean:ebean-ddl-generator:17.2.0'
    implementation 'io.ebean:ebean-migration:14.3.0'
    annotationProcessor 'io.ebean:querybean-generator:17.2.0'
}

ebean {
    debugLevel = 1
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.register('generateMigration', JavaExec) {
    group = 'ebean'
    description = 'Generate Ebean database migration'
    mainClass = 'GenerateDbMigration'
    classpath = sourceSets.test.runtimeClasspath
}
