spring.application.name=server
server.port=3000
datasource.db.username=${DBUSERNAME}
datasource.db.password=${DBPASSWORD}
datasource.db.url=${DBURL}
ebean.migration.run=true
spring.servlet.multipart.max-file-size=-1
spring.servlet.multipart.max-request-size=-1

# File uploads directory (defaults to ./uploads if not set)
# Can be overridden via UPLOADS_DIR environment variable
uploads.dir=${UPLOADS_DIR:./uploads}
