openapi: 3.0.3
info:
  title: Think Different Academy API
  version: 1.0.0

paths:
  /auth/login:
    post:
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"

  /auth/tenants/{countryKey}/login:
    parameters:
      - $ref: "#/components/parameters/CountryKey"
    post:
      summary: Tenant login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"

  /auth/tenants:
    get:
      summary: List tenant countries
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TenantCountry"

  /auth/logout:
    post:
      summary: Logout
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"

  /auth/me:
    get:
      summary: Authenticated profile
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthMeResponse"

  /:
    get:
      summary: Root endpoint
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationResponse"

  /courses:
    get:
      summary: List all courses
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CourseSummary"
    post:
      summary: Create a new course
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CourseCreateRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseSummary"

  /courses/lecturer:
    get:
      summary: List lecturer courses
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CourseSummary"

  /courses/lecturer/{courseId}:
    parameters:
      - $ref: "#/components/parameters/CourseId"
    get:
      summary: Get lecturer course details
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseDetail"

  /courses/{courseId}:
    parameters:
      - $ref: "#/components/parameters/CourseId"
    get:
      summary: Get course details
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseDetail"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      summary: Update course
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CourseUpdateRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseSummary"
    delete:
      summary: Delete course
      responses:
        "204":
          description: No content

  /courses/{courseId}/status:
    parameters:
      - $ref: "#/components/parameters/CourseId"
    put:
      summary: Update course status
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CourseStatusUpdateRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseDetail"

  /courses/{courseId}/start:
    parameters:
      - $ref: "#/components/parameters/CourseId"
    post:
      summary: Start course now
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CourseStartRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseDetail"

  /courses/{courseId}/pause:
    parameters:
      - $ref: "#/components/parameters/CourseId"
    post:
      summary: Pause course
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoursePauseRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseDetail"

  /courses/{courseId}/archive:
    parameters:
      - $ref: "#/components/parameters/CourseId"
    post:
      summary: Archive course
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseDetail"

  /courses/{courseId}/join:
    parameters:
      - $ref: "#/components/parameters/CourseId"
    post:
      summary: Join course
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseJoinResponse"

  /courses/{courseId}/session:
    parameters:
      - $ref: "#/components/parameters/CourseId"
    post:
      summary: Create course session
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CourseSessionRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseSessionResponse"
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseSessionResponse"

  /courses/{courseId}/progress:
    parameters:
      - $ref: "#/components/parameters/CourseId"
    get:
      summary: Get student course progress
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseProgressResponse"

  /courses/{courseId}/certificate:
    parameters:
      - $ref: "#/components/parameters/CourseId"
    get:
      summary: Download course certificate PDF
      responses:
        "200":
          description: OK
          content:
            application/pdf:
              schema:
                type: string
                format: binary

  /courses/{courseId}/leave:
    parameters:
      - $ref: "#/components/parameters/CourseId"
    post:
      summary: Leave course
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseJoinResponse"

  /courses/{courseId}/duplicate:
    parameters:
      - $ref: "#/components/parameters/CourseId"
    post:
      summary: Duplicate course
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CourseDuplicateRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseDetail"

  /courses/{courseId}/export:
    parameters:
      - $ref: "#/components/parameters/CourseId"
    post:
      summary: Export course payload
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseExportPayload"

  /courses/import:
    post:
      summary: Import course payload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CourseExportPayload"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseImportResponse"

  /courses/{courseId}/versions:
    parameters:
      - $ref: "#/components/parameters/CourseId"
    get:
      summary: List course versions
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CourseVersionSummary"

  /courses/{courseId}/versions/{versionNo}:
    parameters:
      - $ref: "#/components/parameters/CourseId"
      - $ref: "#/components/parameters/VersionNo"
    get:
      summary: Get course version snapshot
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseVersionDetail"

  /courses/{courseId}/modules:
    parameters:
      - $ref: "#/components/parameters/CourseId"
    get:
      summary: List modules
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Module"
    post:
      summary: Create module
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModuleCreateRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Module"

  /courses/{courseId}/modules/{moduleId}:
    parameters:
      - $ref: "#/components/parameters/CourseId"
      - $ref: "#/components/parameters/ModuleId"
    put:
      summary: Update module
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModuleUpdateRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Module"
    delete:
      summary: Delete module
      responses:
        "204":
          description: No content

  /courses/{courseId}/modules/{moduleId}/reveal:
    parameters:
      - $ref: "#/components/parameters/CourseId"
      - $ref: "#/components/parameters/ModuleId"
    put:
      summary: Reveal module
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Module"

  /courses/{courseId}/modules/order:
    parameters:
      - $ref: "#/components/parameters/CourseId"
    put:
      summary: Reorder modules (draft only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReorderModulesRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"

  /courses/{courseId}/modules/reveal-next:
    parameters:
      - $ref: "#/components/parameters/CourseId"
    put:
      summary: Reveal next module in order (LIVE only)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Module"

  /courses/{courseId}/modules/hide-last:
    parameters:
      - $ref: "#/components/parameters/CourseId"
    put:
      summary: Hide last revealed module (LIVE only)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Module"

  /courses/{courseId}/modules/{moduleId}/materials:
    parameters:
      - $ref: "#/components/parameters/CourseId"
      - $ref: "#/components/parameters/ModuleId"
    get:
      summary: List module materials
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Material"
    post:
      summary: Add material
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UrlMaterialCreateRequest"
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/FileMaterialCreateRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Material"

  /courses/{courseId}/modules/{moduleId}/materials/{materialId}:
    parameters:
      - $ref: "#/components/parameters/CourseId"
      - $ref: "#/components/parameters/ModuleId"
      - $ref: "#/components/parameters/MaterialId"
    put:
      summary: Update material
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UrlMaterialUpdateRequest"
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/FileMaterialUpdateRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Material"
    delete:
      summary: Delete material
      responses:
        "204":
          description: No content

  /courses/{courseId}/modules/{moduleId}/quizzes:
    parameters:
      - $ref: "#/components/parameters/CourseId"
      - $ref: "#/components/parameters/ModuleId"
    get:
      summary: List module quizzes
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Quiz"
    post:
      summary: Create quiz
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Quiz"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quiz"

  /courses/{courseId}/modules/{moduleId}/quizzes/{quizId}:
    parameters:
      - $ref: "#/components/parameters/CourseId"
      - $ref: "#/components/parameters/ModuleId"
      - $ref: "#/components/parameters/QuizId"
    get:
      summary: Get quiz
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quiz"
    put:
      summary: Update quiz
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Quiz"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quiz"
    delete:
      summary: Delete quiz
      responses:
        "204":
          description: No content

  /courses/{courseId}/modules/{moduleId}/quizzes/{quizId}/submit:
    parameters:
      - $ref: "#/components/parameters/CourseId"
      - $ref: "#/components/parameters/ModuleId"
      - $ref: "#/components/parameters/QuizId"
    post:
      summary: Submit quiz answers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuizSubmitRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuizSubmitResponse"

  /courses/{courseId}/modules/{moduleId}/quizzes/{quizId}/stats:
    parameters:
      - $ref: "#/components/parameters/CourseId"
      - $ref: "#/components/parameters/ModuleId"
      - $ref: "#/components/parameters/QuizId"
    get:
      summary: Get quiz stats
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuizStatsResponse"

  /courses/{courseId}/modules/{moduleId}/quizzes/{quizId}/results:
    parameters:
      - $ref: "#/components/parameters/CourseId"
      - $ref: "#/components/parameters/ModuleId"
      - $ref: "#/components/parameters/QuizId"
    get:
      summary: Get quiz results
      parameters:
        - name: latestPerParticipant
          in: query
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/QuizSubmitResponse"

  /courses/{courseId}/feed:
    parameters:
      - $ref: "#/components/parameters/CourseId"
    get:
      summary: Get course feed
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FeedItem"
    post:
      summary: Add feed post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeedCreateRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedItem"

  /courses/lecturer/{courseId}/feed:
    parameters:
      - $ref: "#/components/parameters/CourseId"
    get:
      summary: Get lecturer course feed
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FeedItem"

  /courses/{courseId}/feed/{postId}:
    parameters:
      - $ref: "#/components/parameters/CourseId"
      - $ref: "#/components/parameters/PostId"
    delete:
      summary: Delete feed post
      responses:
        "204":
          description: No content
    put:
      summary: Update feed post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeedUpdateRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedItem"

  /courses/{courseId}/feed/stream:
    parameters:
      - $ref: "#/components/parameters/CourseId"
    get:
      summary: Stream course feed
      responses:
        "200":
          description: Event stream
          content:
            text/event-stream:
              schema:
                type: string

  /courses/lecturer/{courseId}/feed/stream:
    parameters:
      - $ref: "#/components/parameters/CourseId"
    get:
      summary: Stream lecturer course feed
      responses:
        "200":
          description: Event stream
          content:
            text/event-stream:
              schema:
                type: string

  /courses/{courseId}/stats:
    parameters:
      - $ref: "#/components/parameters/CourseId"
    get:
      summary: Get course stats (lecturer only)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseStatsResponse"

  /courses/{courseId}/stats/stream:
    parameters:
      - $ref: "#/components/parameters/CourseId"
    get:
      summary: Stream course stats (lecturer only)
      responses:
        "200":
          description: Event stream
          content:
            text/event-stream:
              schema:
                type: string

  /courses/{courseId}/materials/{materialId}/interactions:
    parameters:
      - $ref: "#/components/parameters/CourseId"
      - $ref: "#/components/parameters/MaterialId"
    post:
      summary: Record material interaction
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"

  /admin/countries:
    get:
      summary: List countries
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Country"
    post:
      summary: Create country
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CountryCreateRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Country"

  /admin/countries/{countryId}:
    parameters:
      - $ref: "#/components/parameters/CountryId"
    put:
      summary: Update country
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CountryUpdateRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Country"
    delete:
      summary: Delete country
      responses:
        "204":
          description: No content

  /admin/branches:
    get:
      summary: List branches
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BranchAdmin"
    post:
      summary: Create branch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BranchCreateRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BranchAdmin"

  /admin/branches/{branchId}:
    parameters:
      - $ref: "#/components/parameters/BranchId"
    put:
      summary: Update branch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BranchUpdateRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BranchAdmin"
    delete:
      summary: Delete branch
      responses:
        "204":
          description: No content

  /manager/branch:
    get:
      summary: Manager branch profile
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagerBranch"
    put:
      summary: Update manager branch profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BranchUpdateRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"

  /manager/lecturer/credentials:
    put:
      summary: Update lecturer credentials by manager
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManagerLecturerCredentialsRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"

components:
  parameters:
    CountryKey:
      name: countryKey
      in: path
      required: true
      schema:
        type: string
    CountryId:
      name: countryId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    BranchId:
      name: branchId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    VersionNo:
      name: versionNo
      in: path
      required: true
      schema:
        type: integer
    CourseId:
      name: courseId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ModuleId:
      name: moduleId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MaterialId:
      name: materialId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    QuizId:
      name: quizId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PostId:
      name: postId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string

    AuthMeResponse:
      type: object
      required: [status, username, role]
      properties:
        status:
          type: string
        username:
          type: string
        displayName:
          type: string
        role:
          type: string
          enum: [admin, manager, lecturer]
        countryKey:
          type: string
        countryId:
          type: string
        branchId:
          type: string
        branchKey:
          type: string
        branchName:
          type: string

    TenantBranch:
      type: object
      required: [branchKey, name]
      properties:
        branchKey:
          type: string
        name:
          type: string

    TenantCountry:
      type: object
      required: [countryKey, name, branches]
      properties:
        countryKey:
          type: string
        name:
          type: string
        branches:
          type: array
          items:
            $ref: "#/components/schemas/TenantBranch"

    Country:
      type: object
      required: [id, isoCode, name, status]
      properties:
