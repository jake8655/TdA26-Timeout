openapi: 3.0.3
info:
  title: Think Different Academy API
  version: 1.0.0

paths:
  /:
    get:
      summary: Root endpoint
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationResponse'

  /courses:
    get:
      summary: List all courses
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CourseSummary'
    post:
      summary: Create a new course
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CourseCreateRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseSummary'

  /courses/lecturer:
    get:
      summary: List lecturer courses
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CourseSummary'

  /courses/lecturer/{courseId}:
    parameters:
      - $ref: '#/components/parameters/CourseId'
    get:
      summary: Get lecturer course details
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseDetail'

  /courses/{courseId}:
    parameters:
      - $ref: '#/components/parameters/CourseId'
    get:
      summary: Get course details
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseDetail'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      summary: Update course
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CourseUpdateRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseSummary'
    delete:
      summary: Delete course
      responses:
        '204':
          description: No content

  /courses/{courseId}/status:
    parameters:
      - $ref: '#/components/parameters/CourseId'
    put:
      summary: Update course status
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CourseStatusUpdateRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseDetail'

  /courses/{courseId}/start:
    parameters:
      - $ref: '#/components/parameters/CourseId'
    post:
      summary: Start course now
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CourseStartRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseDetail'

  /courses/{courseId}/pause:
    parameters:
      - $ref: '#/components/parameters/CourseId'
    post:
      summary: Pause course
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CoursePauseRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseDetail'

  /courses/{courseId}/archive:
    parameters:
      - $ref: '#/components/parameters/CourseId'
    post:
      summary: Archive course
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseDetail'

  /courses/{courseId}/join:
    parameters:
      - $ref: '#/components/parameters/CourseId'
    post:
      summary: Join course
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseJoinResponse'

  /courses/{courseId}/session:
    parameters:
      - $ref: '#/components/parameters/CourseId'
    post:
      summary: Create course session
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseSessionResponse'

  /courses/{courseId}/leave:
    parameters:
      - $ref: '#/components/parameters/CourseId'
    post:
      summary: Leave course
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseJoinResponse'

  /courses/{courseId}/duplicate:
    parameters:
      - $ref: '#/components/parameters/CourseId'
    post:
      summary: Duplicate course
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CourseDuplicateRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseDetail'

  /courses/{courseId}/modules:
    parameters:
      - $ref: '#/components/parameters/CourseId'
    get:
      summary: List modules
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Module'
    post:
      summary: Create module
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModuleCreateRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Module'

  /courses/{courseId}/modules/{moduleId}:
    parameters:
      - $ref: '#/components/parameters/CourseId'
      - $ref: '#/components/parameters/ModuleId'
    put:
      summary: Update module
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModuleUpdateRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Module'
    delete:
      summary: Delete module
      responses:
        '204':
          description: No content

  /courses/{courseId}/modules/{moduleId}/reveal:
    parameters:
      - $ref: '#/components/parameters/CourseId'
      - $ref: '#/components/parameters/ModuleId'
    put:
      summary: Reveal module
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Module'

  /courses/{courseId}/modules/order:
    parameters:
      - $ref: '#/components/parameters/CourseId'
    put:
      summary: Reorder modules (draft only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReorderModulesRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'

  /courses/{courseId}/modules/reveal-next:
    parameters:
      - $ref: '#/components/parameters/CourseId'
    put:
      summary: Reveal next module in order (LIVE only)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Module'

  /courses/{courseId}/modules/hide-last:
    parameters:
      - $ref: '#/components/parameters/CourseId'
    put:
      summary: Hide last revealed module (LIVE only)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Module'

  /courses/{courseId}/modules/{moduleId}/materials:
    parameters:
      - $ref: '#/components/parameters/CourseId'
      - $ref: '#/components/parameters/ModuleId'
    get:
      summary: List module materials
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Material'
    post:
      summary: Add material
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UrlMaterialCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FileMaterialCreateRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Material'

  /courses/{courseId}/modules/{moduleId}/materials/{materialId}:
    parameters:
      - $ref: '#/components/parameters/CourseId'
      - $ref: '#/components/parameters/ModuleId'
      - $ref: '#/components/parameters/MaterialId'
    put:
      summary: Update material
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UrlMaterialUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FileMaterialUpdateRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Material'
    delete:
      summary: Delete material
      responses:
        '204':
          description: No content

  /courses/{courseId}/modules/{moduleId}/quizzes:
    parameters:
      - $ref: '#/components/parameters/CourseId'
      - $ref: '#/components/parameters/ModuleId'
    get:
      summary: List module quizzes
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Quiz'
    post:
      summary: Create quiz
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Quiz'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quiz'

  /courses/{courseId}/modules/{moduleId}/quizzes/{quizId}:
    parameters:
      - $ref: '#/components/parameters/CourseId'
      - $ref: '#/components/parameters/ModuleId'
      - $ref: '#/components/parameters/QuizId'
    get:
      summary: Get quiz
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quiz'
    put:
      summary: Update quiz
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Quiz'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quiz'
    delete:
      summary: Delete quiz
      responses:
        '204':
          description: No content

  /courses/{courseId}/modules/{moduleId}/quizzes/{quizId}/submit:
    parameters:
      - $ref: '#/components/parameters/CourseId'
      - $ref: '#/components/parameters/ModuleId'
      - $ref: '#/components/parameters/QuizId'
    post:
      summary: Submit quiz answers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuizSubmitRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuizSubmitResponse'

  /courses/{courseId}/modules/{moduleId}/quizzes/{quizId}/stats:
    parameters:
      - $ref: '#/components/parameters/CourseId'
      - $ref: '#/components/parameters/ModuleId'
      - $ref: '#/components/parameters/QuizId'
    get:
      summary: Get quiz stats
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuizStatsResponse'

  /courses/{courseId}/modules/{moduleId}/quizzes/{quizId}/results:
    parameters:
      - $ref: '#/components/parameters/CourseId'
      - $ref: '#/components/parameters/ModuleId'
      - $ref: '#/components/parameters/QuizId'
    get:
      summary: Get quiz results
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/QuizSubmitResponse'

  /courses/{courseId}/feed:
    parameters:
      - $ref: '#/components/parameters/CourseId'
    get:
      summary: Get course feed
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FeedItem'
    post:
      summary: Add feed post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeedCreateRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedItem'

  /courses/{courseId}/feed/{postId}:
    parameters:
      - $ref: '#/components/parameters/CourseId'
      - $ref: '#/components/parameters/PostId'
    delete:
      summary: Delete feed post
      responses:
        '204':
          description: No content
    put:
      summary: Update feed post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeedUpdateRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedItem'

  /courses/{courseId}/feed/stream:
    parameters:
      - $ref: '#/components/parameters/CourseId'
    get:
      summary: Stream course feed
      responses:
        '200':
          description: Event stream
          content:
            text/event-stream:
              schema:
                type: string

  /courses/{courseId}/stats:
    parameters:
      - $ref: '#/components/parameters/CourseId'
    get:
      summary: Get course stats (lecturer only)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseStatsResponse'

  /courses/{courseId}/stats/stream:
    parameters:
      - $ref: '#/components/parameters/CourseId'
    get:
      summary: Stream course stats (lecturer only)
      responses:
        '200':
          description: Event stream
          content:
            text/event-stream:
              schema:
                type: string

  /courses/{courseId}/materials/{materialId}/interactions:
    parameters:
      - $ref: '#/components/parameters/CourseId'
      - $ref: '#/components/parameters/MaterialId'
    post:
      summary: Record material interaction
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'

components:
  parameters:
    CourseId:
      name: courseId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ModuleId:
      name: moduleId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MaterialId:
      name: materialId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    QuizId:
      name: quizId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PostId:
      name: postId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    OrganizationResponse:
      type: object
      required: [organization]
      properties:
        organization:
          type: string

    ErrorResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string

    CourseSummary:
      type: object
      required: [uuid, name]
      properties:
        uuid:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/CourseStatus'
        scheduledStartAt:
          type: string
          format: date-time
        scheduledEndAt:
          type: string
          format: date-time
        pausedAt:
          type: string
          format: date-time
        archivedAt:
          type: string
          format: date-time
        joined:
          type: boolean

    CourseCreateRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        description:
          type: string

    CourseUpdateRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string

    CourseDetail:
      type: object
      required: [uuid, name]
      properties:
        uuid:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        modules:
          type: array
          items:
            $ref: '#/components/schemas/Module'
        feed:
          type: array
          items:
            $ref: '#/components/schemas/FeedItem'
        status:
          $ref: '#/components/schemas/CourseStatus'
        scheduledStartAt:
          type: string
          format: date-time
        scheduledEndAt:
          type: string
          format: date-time
        pausedAt:
          type: string
          format: date-time
        archivedAt:
          type: string
          format: date-time
        joined:
          type: boolean

    CourseStatus:
      type: string
      enum: [draft, scheduled, live, paused, archived]

    CourseStatusUpdateRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
        scheduledStartAt:
          type: string
          format: date-time
        scheduledEndAt:
          type: string
          format: date-time

    CourseStartRequest:
      type: object
      required: [scheduledEndAt]
      properties:
        scheduledEndAt:
          type: string
          format: date-time

    CoursePauseRequest:
      type: object
      properties:
        scheduledStartAt:
          type: string
          format: date-time
        scheduledEndAt:
          type: string
          format: date-time

    CourseJoinResponse:
      type: object
      properties:
        status:
          type: string
        joinedAt:
          type: string
          format: date-time

    CourseSessionResponse:
      type: object
      properties:
        status:
          type: string
        sessionId:
          type: string

    CourseDuplicateRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string

    Module:
      type: object
      required: [uuid, title, visible]
      properties:
        uuid:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        visible:
          type: boolean
        revealedAt:
          type: string
          format: date-time
        orderIndex:
          type: integer
        materials:
          type: array
          items:
            $ref: '#/components/schemas/Material'
        quizzes:
          type: array
          items:
            $ref: '#/components/schemas/Quiz'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ModuleCreateRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
        description:
          type: string

    ModuleUpdateRequest:
      type: object
      properties:
        title:
          type: string
        description:
          type: string

    Material:
      oneOf:
        - $ref: '#/components/schemas/FileMaterial'
        - $ref: '#/components/schemas/UrlMaterial'
      discriminator:
        propertyName: type
        mapping:
          file: '#/components/schemas/FileMaterial'
          url: '#/components/schemas/UrlMaterial'

    FileMaterial:
      type: object
      required: [uuid, type, name, fileUrl]
      properties:
        uuid:
          type: string
          format: uuid
        type:
          type: string
          enum: [file]
        name:
          type: string
        description:
          type: string
        fileUrl:
          type: string
        mimeType:
          type: string
        sizeBytes:
          type: integer
          format: int64

    UrlMaterial:
      type: object
      required: [uuid, type, name, url]
      properties:
        uuid:
          type: string
          format: uuid
        type:
          type: string
          enum: [url]
        name:
          type: string
        description:
          type: string
        url:
          type: string
        faviconUrl:
          type: string

    FileMaterialCreateRequest:
      type: object
      required: [type, name, file]
      properties:
        type:
          type: string
          enum: [file]
        name:
          type: string
        description:
          type: string
        file:
          type: string
          format: binary

    UrlMaterialCreateRequest:
      type: object
      required: [type, name, url]
      properties:
        type:
          type: string
          enum: [url]
        name:
          type: string
        description:
          type: string
        url:
          type: string

    FileMaterialUpdateRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        file:
          type: string
          format: binary

    UrlMaterialUpdateRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        url:
          type: string

    Quiz:
      type: object
      required: [title, questions]
      properties:
        uuid:
          type: string
          format: uuid
        title:
          type: string
        attemptsCount:
          type: integer
        questions:
          type: array
          items:
            $ref: '#/components/schemas/Question'

    Question:
      oneOf:
        - $ref: '#/components/schemas/SingleChoiceQuestion'
        - $ref: '#/components/schemas/MultipleChoiceQuestion'
      discriminator:
        propertyName: type
        mapping:
          singleChoice: '#/components/schemas/SingleChoiceQuestion'
          multipleChoice: '#/components/schemas/MultipleChoiceQuestion'

    SingleChoiceQuestion:
      type: object
      required: [type, question, options, correctIndex]
      properties:
        uuid:
          type: string
          format: uuid
        type:
          type: string
          enum: [singleChoice]
        question:
          type: string
        options:
          type: array
          items:
            type: string
        correctIndex:
          type: integer

    MultipleChoiceQuestion:
      type: object
      required: [type, question, options, correctIndices]
      properties:
        uuid:
          type: string
          format: uuid
        type:
          type: string
          enum: [multipleChoice]
        question:
          type: string
        options:
          type: array
          items:
            type: string
        correctIndices:
          type: array
          items:
            type: integer

    QuizSubmitRequest:
      type: object
      required: [answers]
      properties:
        answers:
          type: array
          items:
            $ref: '#/components/schemas/QuizAnswer'

    QuizAnswer:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
        selectedIndex:
          type: integer
        selectedIndices:
          type: array
          items:
            type: integer
        comment:
          type: string

    QuizSubmitResponse:
      type: object
      required: [quizUuid, score, maxScore, submittedAt]
      properties:
        quizUuid:
          type: string
          format: uuid
        score:
          type: number
        maxScore:
          type: number
        correctPerQuestion:
          type: array
          items:
            type: boolean
        submittedAt:
          type: string
          format: date-time

    QuizStatsResponse:
      type: object
      required: [quizUuid, quizTitle, totalSubmissions, questions]
      properties:
        quizUuid:
          type: string
          format: uuid
        quizTitle:
          type: string
        totalSubmissions:
          type: integer
        questions:
          type: array
          items:
            $ref: '#/components/schemas/QuestionStats'

    QuestionStats:
      type: object
      required: [questionUuid, type, question, options, optionCounts]
      properties:
        questionUuid:
          type: string
          format: uuid
        type:
          type: string
          enum: [singleChoice, multipleChoice]
        question:
          type: string
        options:
          type: array
          items:
            type: string
        correctIndex:
          type: integer
        correctIndices:
          type: array
          items:
            type: integer
        optionCounts:
          type: object
          additionalProperties:
            type: integer

    FeedItem:
      type: object
      required: [uuid, type, message, createdAt]
      properties:
        uuid:
          type: string
          format: uuid
        type:
          type: string
          enum: [manual, system]
        message:
          type: string
        edited:
          type: boolean
        createdAt:
          type: string
