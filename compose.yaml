services:
  web:
    build:
      context: apps/web
      args:
        - NEXT_PUBLIC_API_BASE=/api
    ports:
      - "3001:3001"
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: timeoutdb
      MYSQL_USER: ${DBUSERNAME:-timeoutuser}
      MYSQL_PASSWORD: ${DBPASSWORD:-timeout-dev-password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-timeout-dev-root-password}
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 180s
  server:
    build: apps/server
    ports:
      - "3000:3000"
    environment:
      DBURL: "jdbc:mysql://mysql:3306/timeoutdb"
      DBUSERNAME: ${DBUSERNAME:-timeoutuser}
      DBPASSWORD: ${DBPASSWORD:-timeout-dev-password}
      DEFAULT_LECTURER_USERNAME: ${DEFAULT_LECTURER_USERNAME:-lecturer}
      DEFAULT_LECTURER_PASSWORD: ${DEFAULT_LECTURER_PASSWORD:-timeout-dev-lecturer-password}
      UPLOADS_DIR: /app/uploads
    volumes:
      - uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
  caddy:
    build: apps/caddy
    environment:
      - SERVER_UPSTREAM=server:3000
      - WEB_UPSTREAM=web:3001
    ports:
      - "80:80"
    depends_on:
      - web
      - server

volumes:
  uploads:
