# yaml-language-server: $schema=https://portalbush.tourde.cloud/static/schema.json
exposedPort: 80
containers:
  - name: web
    image: registry.tourde.cloud/timeout/web
    port: 3001
    env:
      NEXT_PUBLIC_API_BASE: /api
  - name: server
    image: registry.tourde.cloud/timeout/server
    port: 3000
    env:
      DBUSERNAME: "root"
      DBPASSWORD: "TGCQeIKeCYpAeyiPTG37gpzy"
      DBURL: "jdbc:mysql://localhost:3306/timeoutdb"
      API_KEY: "gOS1ncPt09q++cSyyOAdGIuR5qeKEqvWkcj9uX4ygNM="
      CDN_URL: "https://timeout-cdn.nyaverlose.cc"
  - name: mysql
    image: mysql
    tag: "8.0"
    env:
      MYSQL_DATABASE: timeoutdb
      MYSQL_ROOT_PASSWORD: "TGCQeIKeCYpAeyiPTG37gpzy"
    port: 3306
  - name: caddy
    image: registry.tourde.cloud/timeout/caddy
    port: 80
    env:
      SERVER_UPSTREAM: 127.0.0.1:3000
      WEB_UPSTREAM: 127.0.0.1:3001
build:
  - name: web
    context: ./apps/web
    dockerfile: ./apps/web/Dockerfile
  - name: server
    context: ./apps/server
    dockerfile: ./apps/server/Dockerfile
  - name: caddy
    context: ./apps/caddy
    dockerfile: ./apps/caddy/Dockerfile
