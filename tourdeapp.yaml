# yaml-language-server: $schema=https://portalbush.tourde.cloud/static/schema.json
exposedPort: 80
containers:
  - name: web
    image: registry.tourde.cloud/timeout/web
    port: 3001
  # - name: server
  #   image: registry.tourde.cloud/timeout/server
  #   port: 3000
  #   env:
  #     DATABASE_URL: mysql://root:password@localhost:3306/tda_app
  - name: mysql
    image: mysql
    tag: "8.0"
    env:
      DATABASE_NAME: tda_app
      DATABASE_PASSWORD: password
    port: 3306
  - name: caddy
    image: registry.tourde.cloud/timeout/caddy
    port: 80
build:
  - name: web
    context: ./apps/web
    dockerfile: ./apps/web/Dockerfile
  # - name: server
  #   context: ./apps/server
  #   dockerfile: ./apps/server/Dockerfile
  - name: caddy
    context: ./apps/caddy
    dockerfile: ./apps/caddy/Dockerfile
