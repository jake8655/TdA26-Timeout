# yaml-language-server: $schema=https://portalbush.tourde.cloud/static/schema.json
exposedPort: 80
containers:
  - name: web
    image: registry.tourde.cloud/timeout/web
    port: 3001
  - name: server
    image: registry.tourde.cloud/timeout/server
    port: 3000
  - name: caddy
    image: registry.tourde.cloud/timeout/caddy
    port: 80
    env:
      SERVER_UPSTREAM: 127.0.0.1:3000
      WEB_UPSTREAM: 127.0.0.1:3001
build:
  - name: web
    context: ./apps/web
    dockerfile: ./apps/web/Dockerfile
  - name: server
    context: ./apps/server
    dockerfile: ./apps/server/Dockerfile
  - name: caddy
    context: ./apps/caddy
    dockerfile: ./apps/caddy/Dockerfile
